<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="UniBreak framework overview">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b7f"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7048e8"/>
    </marker>
    <style>
      .box   { fill: #f7f9fc; stroke: #c9d3e3; stroke-width: 1.4; }
      .boxA  { fill: #eef2ff; stroke: #748ffc; stroke-width: 1.6; }
      .boxB  { fill: #f3f0ff; stroke: #9775fa; stroke-width: 1.6; }
      .boxC  { fill: #ebfbee; stroke: #37b24d; stroke-width: 1.6; }
      .label { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1f2933; }
      .small { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #5c6b7f; }
      .flow  { stroke: #5c6b7f; stroke-width: 1.5; fill: none; }
      .dash  { stroke: #7048e8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- row 1 -->
  <rect class="box" x="25" y="50" width="105" height="64" rx="10"/>
  <text class="label" x="77" y="78" text-anchor="middle">Harmful</text>
  <text class="label" x="77" y="96" text-anchor="middle">query q</text>

  <rect class="boxA" x="185" y="50" width="165" height="64" rx="10"/>
  <text class="label" x="267" y="78" text-anchor="middle">Perturbed prompt</text>
  <text class="label" x="267" y="96" text-anchor="middle">q &#8853; P</text>

  <rect class="box" x="405" y="50" width="125" height="64" rx="10" stroke="#3b5bdb"/>
  <text class="label" x="467" y="78" text-anchor="middle">Victim LLM</text>
  <text class="small" x="467" y="96" text-anchor="middle">white-box</text>

  <rect class="box" x="585" y="50" width="120" height="64" rx="10"/>
  <text class="label" x="645" y="78" text-anchor="middle">Response r</text>
  <text class="small" x="645" y="96" text-anchor="middle">continuation</text>

  <rect class="boxC" x="760" y="50" width="110" height="64" rx="10"/>
  <text class="label" x="815" y="78" text-anchor="middle">Judge</text>
  <text class="small" x="815" y="96" text-anchor="middle">prefix rule</text>

  <!-- arrows row 1 -->
  <path class="flow" d="M130 82 H180" marker-end="url(#arrow)"/>
  <path class="flow" d="M350 82 H400" marker-end="url(#arrow)"/>
  <path class="flow" d="M530 82 H580" marker-end="url(#arrow)"/>
  <path class="flow" d="M705 82 H755" marker-end="url(#arrow)"/>

  <!-- feedback -->
  <path class="flow" d="M815 114 V236 H665" marker-end="url(#arrow)"/>
  <text class="small" x="700" y="228" text-anchor="middle">fitness</text>

  <path class="flow" d="M240 236 H268 V114" marker-end="url(#arrow)"/>
  <text class="small" x="276" y="180">new population</text>

  <!-- operators -->
  <rect class="boxA" x="240" y="200" width="420" height="72" rx="10"/>
  <text class="label" x="450" y="226" text-anchor="middle">Evolutionary operators</text>
  <text class="small" x="450" y="248" text-anchor="middle">gradient  &#183;  crossover  &#183;  selection  &#183;  mutation</text>

  <!-- repository -->
  <rect class="boxB" x="240" y="310" width="280" height="52" rx="10"/>
  <text class="label" x="380" y="332" text-anchor="middle">Perturbation repository</text>
  <text class="small" x="380" y="350" text-anchor="middle">reused across queries</text>

  <path class="dash" d="M380 310 V276" marker-end="url(#arrowAccent)"/>
  <text class="small" x="500" y="298" text-anchor="middle">warm start &#183; token sensitivity</text>
</svg>
